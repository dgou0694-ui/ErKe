name: 保活机制（防止监控任务被禁用）

# 背景说明：
# GitHub 对公开仓库设有一条 inactivity 规则——仓库连续 60 天没有任何活动时，
# 平台会自动禁用其中的定时工作流（依据见 GitHub 官方文档 Events that trigger workflows）。
# 本工作流通过两条途径规避这一规则：
#   1. 每周产生一次真实的仓库提交（更新时间戳文件），维持仓库活动状态；
#   2. 每次运行时主动调用接口重新启用监控工作流与自身，防止被误禁用后无人察觉。
# 运行时间设为每周一 UTC 03:20，即北京时间周一 11:20。
# 分钟数刻意避开整点，因为 GitHub 在整点时段调度拥堵，延迟或丢弃概率更高。
on:
  schedule:
    - cron: '20 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 写入时间戳并提交
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          if git diff --cached --quiet; then
            echo "时间戳未发生变化，本次无需提交"
          else
            git commit -m "chore: keepalive $(date -u '+%Y-%m-%d')"
            git push
          fi

      - name: 重新启用定时工作流
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/monitor.yml/enable"
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/keepalive.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
